[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-script"
version = "0.1.0"
description = "Terminal-based Wiki.js manager"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "gql[requests]>=4.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
wiki-cli = "wiki_cli:main"

[tool.setuptools]
packages = ["wiki_cli", "wiki_cli.pages"]


