[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-script"
version = "0.1.0"
description = "Terminal-based Wiki.js manager"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "gql[requests]>=4.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.scripts]
wiki-cli = "wiki_cli:main"
wiki-ai = "wiki_cli.ai.cli:ai_mode"

[project.optional-dependencies]
ai = [
    "openai>=1.0.0",
    "httpx>=0.25.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.setuptools]
packages = ["wiki_cli", "wiki_cli.pages", "wiki_cli.ai"]

[tool.pytest.ini_options]
pythonpath = ["tests"]


